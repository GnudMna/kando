services:
  db:
    image: postgres:18-alpine
    container_name: kando-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kando_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kando_password}
      POSTGRES_DB: ${POSTGRES_DB:-kanban_db}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ./pgdata:/var/lib/postgresql/data/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kando_user} -d ${POSTGRES_DB:-kanban_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: kando-backend
    expose:
      - "3001"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-kando_user}:${POSTGRES_PASSWORD:-kando_password}@db:5432/${POSTGRES_DB:-kanban_db}
      POSTGRES_USER: ${POSTGRES_USER:-kando_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kando_password}
      POSTGRES_DB: ${POSTGRES_DB:-kanban_db}
      AUTH_SECRET: ${AUTH_SECRET:-dev-only-secret-change-in-production}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: kando-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
