server {
    listen 80;
    server_name localhost;
    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml;
    gzip_vary on;
    gzip_min_length 1024;

    # セキュリティヘッダーは server ブロックに置かない。ここに置くと /api/ のプロキシ応答にも付き、
    # バックエンドが返すヘッダーと二重になる。特に CSP は両方がブラウザで適用され、
    # /api/docs だけに許可した Swagger UI 用の緩和(unpkg・nonce 付きインラインスクリプト)が
    # SPA 用の厳しい CSP で打ち消されて動かなくなる。SPA を配信する location にだけ付ける

    # Vite がコンテンツハッシュを付与するアセット — 1年間キャッシュ可能
    location ~* ^/assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        # SPA 用 CSP。Google Fonts(CSS/フォント)のみ外部許可。
        # style-src の 'unsafe-inline' は @hello-pangea/dnd が <style> を動的挿入するため必要(スクリプトは 'self' のみ)
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
    }

    # ヘッダーはバックエンド(helmet)が付けるものをそのまま返す。ここで add_header を足さないこと
    location /api/ {
        proxy_pass http://backend:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
